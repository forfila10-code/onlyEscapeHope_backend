      port: 6379
      
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: "27630c2159f4c6fb2e7c7b35990f6e72"
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: profile_nickname # 이메일은 빼고 닉네임만 받습니다!
            client-name: Kakao
            client-secret: "9fqDKrCWeSJnlxV4Q5D6WrquUq3G0b7A"
